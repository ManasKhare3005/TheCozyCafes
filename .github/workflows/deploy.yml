name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatroom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatroom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatroom?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-release-validation
      CLIENT_URL: http://localhost:5173
      APP_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse committed secrets
        run: node scripts/check-secrets.mjs

      - name: Setup Node for server
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install server dependencies
        working-directory: Server
        run: npm ci

      - name: Validate Prisma schema
        working-directory: Server
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: Server
        run: npx prisma generate

      - name: Check server syntax
        working-directory: Server
        run: npm run check:syntax

      - name: Run server coverage
        working-directory: Server
        run: npm run test:coverage

      - name: Audit server production dependencies
        working-directory: Server
        run: npm audit --omit=dev

      - name: Setup Node for client
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install client dependencies
        working-directory: Client
        run: npm ci

      - name: Build client
        working-directory: Client
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'http://localhost:3001/api' }}
          VITE_SOCKET_URL: ${{ vars.STAGING_SOCKET_URL || 'http://localhost:3001' }}

      - name: Audit client production dependencies
        working-directory: Client
        run: npm audit --omit=dev

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'staging'
    environment:
      name: staging
    steps:
      - name: Trigger staging deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing STAGING_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          curl --fail --request POST "$DEPLOY_HOOK_URL"

  deploy-production:
    name: Promote Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment:
      name: production
    steps:
      - name: Trigger production deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing PRODUCTION_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          curl --fail --request POST "$DEPLOY_HOOK_URL"
